<ion-card class="tarjeta-pelicula" [class.seleccionada]="esSeleccionada">
  <img 
    [src]="pelicula.poster_path" 
    [alt]="pelicula.title" 
    class="img-catalogo" 
    (click)="onAbrirModal()" 
  />

  <ion-card-header>
    <ion-card-title>{{ pelicula.title }}</ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <ion-button 
      expand="block" 
      size="small" 
      [color]="esSeleccionada ? 'danger' : (pelicula.seleccionada ? 'success' : 'primary')" 
      (click)="onAccionBoton()">
      {{ textoBoton }}
    </ion-button>
  </ion-card-content>
</ion-card>
